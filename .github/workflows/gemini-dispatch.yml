name: '🔀 Gemini Dispatch'

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'synchronize'
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  issue_comment:
    types:
      - 'created'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: 'number'
      additional_context:
        description: 'Optional extra review instructions'
        required: false
        type: 'string'
        default: ''

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    name: 'Route Gemini request'
    if: |-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '@gemini-cli /review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          startsWith(github.event.review.body, '@gemini-cli /review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          startsWith(github.event.comment.body, '@gemini-cli /review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      pr_number: '${{ steps.extract_command.outputs.pr_number }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
    steps:
      - name: 'Extract Gemini command'
        id: 'extract_command'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # v9
        env:
          EVENT_NAME: '${{ github.event_name }}'
          EVENT_ACTION: '${{ github.event.action }}'
          REQUEST: "${{ github.event.comment.body || github.event.review.body || inputs.additional_context || '' }}"
          WORKFLOW_PR_NUMBER: "${{ inputs.pr_number || '' }}"
        with:
          script: |
            const eventName = process.env.EVENT_NAME;
            const eventAction = process.env.EVENT_ACTION;
            const request = process.env.REQUEST || '';
            const workflowPrNumber = process.env.WORKFLOW_PR_NUMBER || '';
            const payload = context.payload;

            const prNumber = String(
              payload.pull_request?.number ||
              payload.issue?.number ||
              workflowPrNumber ||
              '',
            );

            core.setOutput('pr_number', prNumber);

            if (eventName === 'pull_request' && ['opened', 'reopened', 'synchronize'].includes(eventAction)) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', '');
              return;
            }

            if (eventName === 'workflow_dispatch') {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.trim());
              return;
            }

            if (request.startsWith('@gemini-cli /review')) {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', request.replace(/^@gemini-cli\s+\/review\b/, '').trim());
              return;
            }

            core.setOutput('command', 'fallthrough');
            core.setOutput('additional_context', '');

      - name: 'Acknowledge manual request'
        if: |-
          ${{
            steps.extract_command.outputs.command == 'review' &&
            github.event_name != 'pull_request' &&
            github.event_name != 'workflow_dispatch'
          }}
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ steps.extract_command.outputs.pr_number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, I've received your Gemini review request and started a review run. Track progress in this workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  review:
    name: 'Run Gemini review'
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' && needs.dispatch.outputs.pr_number != '' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      pr_number: '${{ needs.dispatch.outputs.pr_number }}'
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'
